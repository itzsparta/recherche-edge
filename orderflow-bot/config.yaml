symbol: BTCUSDT
market: spot          # spot | futures — live futures geo-bloque depuis la France
tick_size: 0.01       # tick spot BTCUSDT (futures : 0.1)
bin_size: 1.0           # footprint bars (imbalances par niveau)
profile_bin_size: 25.0  # profils volume / zones : gros bins -> LVN significatifs
bar_minutes: 1
data_dir: data
journal_path: journal.jsonl
equity: 10000

risk:
  risk_pct: 0.0075
  daily_stop_pct: 0.02
  max_consecutive_losses: 3
  max_trades_per_day: 3
  min_rr: 2.0
  partial_at_r: 1.0
  partial_fraction: 0.5
  trail_r: null                # BE fige. (trailing 1R teste 2026-06-13 : -0.298R vs -0.267R, ecrete les gros wins +2.3R->+1.2R)
  qty_step: 0.001
  max_leverage: 1.0            # notionnel <= equity x levier (1 = spot sans marge)
  min_stop_friction_mult: 3.0  # distance stop >= 3x (frais maker+taker + slippage)

fees:
  maker_pct: 0.0002
  taker_pct: 0.0005
  slippage_ticks: 2

strategy:
  zone_margin_pct: 0.002   # zone ±0.2 % -> stop max ~360 pts > plancher friction ~190
  stop_buffer_ticks: 20
  entry_expire_minutes: 15
  profile_days: 5
  npoc_lookback_days: 20
  absorption:
    window_ms: 30000
    vol_factor: 3.0
    max_range_ticks: 15
    min_delta_frac: 0.3
    baseline_windows: 20
  imbalance:
    ratio: 3.0
    min_stack: 3

# Overlap Londres-NY, UTC
sessions:
  - {start: "13:00", end: "17:00"}

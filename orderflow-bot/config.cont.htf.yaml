symbol: BTCUSDT
market: spot
tick_size: 0.01
bin_size: 1.0
profile_bin_size: 25.0
bar_minutes: 15        # HTF : footprint 15min (vs 1min) -> signal plus haute TF
data_dir: data
journal_path: journal.jsonl
equity: 10000

risk:
  risk_pct: 0.0075
  daily_stop_pct: 0.02
  max_consecutive_losses: 3
  max_trades_per_day: 3
  min_rr: 2.0
  partial_at_r: 1.0
  partial_fraction: 0.5
  trail_r: null
  qty_step: 0.001
  max_leverage: 1.0
  min_stop_friction_mult: 3.0

fees:
  maker_pct: 0.0002
  taker_pct: 0.0005
  slippage_ticks: 2

strategy:
  signal_mode: continuation
  zone_margin_pct: 0.005   # HTF : zones +-0.5% (vs 0.2%) -> stops ~2.5x plus larges -> frais dilues
  stop_buffer_ticks: 20
  entry_expire_minutes: 60   # HTF : 1min->15min bars, fenetre de fill plus longue
  profile_days: 5
  npoc_lookback_days: 20
  absorption:
    window_ms: 30000
    vol_factor: 3.0
    max_range_ticks: 15
    min_delta_frac: 0.3
    baseline_windows: 20
  imbalance:
    ratio: 3.0
    min_stack: 3

sessions:
  - {start: "13:00", end: "17:00"}
